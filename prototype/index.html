<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESG-PDF Auto-Tagger & Auditor — 지속가능성 공시 자동화</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-28 selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- SEED ESG DISCLOSURE DATA ---
    const INITIAL_DISCLOSURES = [
      {
        id: 'GRI-305-1',
        name: 'Direct (Scope 1) GHG Emissions',
        framework: 'GRI 2021 / IFRS S2',
        page: 42,
        disclosed: true,
        completeness: 100,
        status: 'verified',
        extractedValue: '124,530 tCO2eq',
        missingNotes: '요구사항 충족 완료 (온실가스 집계 기준 명시됨)',
        pdfSnippet: '2025년 당사 사업장 직접 온실가스(Scope 1) 배출량은 총 124,530 tCO2eq이며, 배출계수는 환경부 가이드라인을 준용함.'
      },
      {
        id: 'GRI-305-2',
        name: 'Energy Indirect (Scope 2) Emissions',
        framework: 'GRI 2021 / IFRS S2',
        page: 43,
        disclosed: true,
        completeness: 85,
        status: 'pending',
        extractedValue: '210,480 tCO2eq',
        missingNotes: '시장 기반(Market-based) 배출량 보완 검증 필요',
        pdfSnippet: '전력 사용에 따른 간접 배출량(Scope 2, 위치기반)은 210,480 tCO2eq로 집계되었습니다.'
      },
      {
        id: 'GRI-401-1',
        name: 'New Employee Hires and Turnover',
        framework: 'GRI 2021',
        page: 68,
        disclosed: true,
        completeness: 100,
        status: 'verified',
        extractedValue: '신규채용 84명 / 이직률 4.2%',
        missingNotes: '연령별, 성별 세부 분할 집계표 포함됨',
        pdfSnippet: '2025년도 총 신규 채용인원은 84명(여성 42.8%), 자발적 이직률은 4.2%를 기록하였습니다.'
      },
      {
        id: 'IFRS-S1-GOV',
        name: 'Governance: Board Oversight of Sustainability',
        framework: 'IFRS S1 / TCFD',
        page: 18,
        disclosed: false,
        completeness: 30,
        status: 'missing',
        extractedValue: '미탐지',
        missingNotes: 'ESG위원회의 기후 리스크 감독 주기 및 핵심 KPI 명시 누락',
        pdfSnippet: '이사회 산하 ESG위원회를 반기 1회 개최하여 관련 안건을 보고받고 있습니다. (세부 평가체계 부재)'
      }
    ];

    function App() {
      const [step, setStep] = useState('workbench'); // 'upload' | 'workbench'
      const [disclosures, setDisclosures] = useState(INITIAL_DISCLOSURES);
      const [selectedItem, setSelectedItem] = useState(INITIAL_DISCLOSURES[0]);
      const [activeFilter, setActiveFilter] = useState('all'); // 'all' | 'verified' | 'pending' | 'missing'

      // Metrics
      const totalCount = disclosures.length;
      const verifiedCount = disclosures.filter(d => d.status === 'verified').length;
      const disclosureRate = Math.round((verifiedCount / totalCount) * 100);

      const filteredItems = disclosures.filter(d => {
        if (activeFilter === 'all') return true;
        return d.status === activeFilter;
      });

      const approveItem = (id) => {
        const updated = disclosures.map(d => d.id === id ? { ...d, status: 'verified', completeness: 100 } : d);
        setDisclosures(updated);
        const cur = updated.find(d => d.id === id);
        if (cur) setSelectedItem(cur);
      };

      const handleExportExcel = () => {
        alert('📊 표준 GRI Content Index (.xlsx) 및 IFRS 대응표가 정상적으로 다운로드되었습니다.');
      };

      return (
        <div className="max-w-md mx-auto min-h-screen px-4 pt-5">
          {/* HEADER */}
          <header className="mb-4">
            <div className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-teal-400"></span>
              <span className="text-[10px] tracking-widest text-teal-400 font-bold uppercase">ESG PDF Auto-Tagger</span>
            </div>
            <h1 className="text-xl font-black text-white mt-0.5">지속가능성 공시 검증 워크벤치</h1>
            <p className="text-xs text-slate-400 mt-1">GRI 2021 & IFRS S1/S2 자동 매핑 및 엑셀 인덱서</p>
          </header>

          {/* PROJECT SUMMARY STATS */}
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-3 mb-4">
            <div className="flex justify-between items-center">
              <div>
                <span className="text-[10px] font-bold text-slate-400">분석 보고서</span>
                <div className="text-sm font-bold text-white">2025_Sustainability_Report.pdf</div>
              </div>
              <span className="text-xs font-mono font-bold px-2.5 py-1 rounded-xl bg-teal-950 text-teal-300 border border-teal-800">
                124 Pages
              </span>
            </div>

            {/* Disclosure Progress Bar */}
            <div>
              <div className="flex justify-between text-xs font-bold mb-1.5">
                <span className="text-slate-300">표준 공시 충족률 (Completeness)</span>
                <span className="text-teal-400 font-mono">{disclosureRate}%</span>
              </div>
              <div className="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800">
                <div 
                  className="bg-gradient-to-r from-teal-500 to-emerald-400 h-full rounded-full transition-all duration-500"
                  style={{ width: `${disclosureRate}%` }}>
                </div>
              </div>
            </div>

            <div className="flex justify-between items-center text-[11px] text-slate-400 pt-2 border-t border-slate-800/60">
              <span>검증 완료: <strong className="text-emerald-400 font-mono">{verifiedCount}</strong>건</span>
              <span>검토 필요: <strong className="text-amber-400 font-mono">{disclosures.filter(d => d.status === 'pending').length}</strong>건</span>
              <span>공시 누락: <strong className="text-rose-400 font-mono">{disclosures.filter(d => d.status === 'missing').length}</strong>건</span>
            </div>
          </div>

          {/* FILTER TABS */}
          <div className="flex gap-1.5 overflow-x-auto pb-2 mb-3 scrollbar-none text-xs font-bold">
            {[
              { id: 'all', label: '전체 지표' },
              { id: 'pending', label: '⚠️ 검토 필요' },
              { id: 'missing', label: '❌ 미공시 지표' },
              { id: 'verified', label: '✅ 승인 완료' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveFilter(tab.id)}
                className={`px-3 py-1.5 rounded-xl shrink-0 transition-all border ${activeFilter === tab.id ? 'bg-slate-800 border-teal-500 text-teal-300 shadow' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                {tab.label}
              </button>
            ))}
          </div>

          {/* SPLIT VIEW WORKBENCH */}
          <div className="space-y-4">
            {/* 1. INDICATORS LIST */}
            <div className="space-y-2.5">
              {filteredItems.map(item => (
                <div 
                  key={item.id}
                  onClick={() => setSelectedItem(item)}
                  className={`p-4 rounded-2xl border transition-all cursor-pointer ${selectedItem.id === item.id ? 'bg-slate-900 border-teal-500 shadow-md ring-1 ring-teal-500/30' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}>
                  <div className="flex justify-between items-start mb-1.5">
                    <div>
                      <span className="text-[10px] font-mono font-bold text-teal-400 mr-2">{item.id}</span>
                      <span className="text-xs font-bold text-white">{item.name}</span>
                    </div>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">
                      p.{item.page}
                    </span>
                  </div>

                  <div className="flex justify-between items-center text-[11px] text-slate-400 pt-1">
                    <span className="truncate max-w-[200px]">{item.extractedValue}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${item.status === 'verified' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : item.status === 'pending' ? 'bg-amber-950 text-amber-400 border border-amber-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}`}>
                      {item.status === 'verified' ? '완전 공시' : item.status === 'pending' ? '보완 필요' : '누락'}
                    </span>
                  </div>
                </div>
              ))}
            </div>

            {/* 2. PDF EVIDENCE INSPECTION CARD */}
            {selectedItem && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-3 mt-4">
                <div className="flex justify-between items-center border-b border-slate-800/80 pb-3">
                  <div>
                    <span className="text-[10px] font-mono text-teal-400 font-bold uppercase">{selectedItem.id} 상세 검증</span>
                    <h3 className="text-sm font-bold text-white">{selectedItem.name}</h3>
                  </div>
                  <div className="text-right">
                    <span className="text-xs text-slate-400 font-mono block">PDF 본문 위치</span>
                    <span className="text-xs font-bold text-teal-300 font-mono">Page {selectedItem.page}</span>
                  </div>
                </div>

                {/* PDF Snippet Box */}
                <div>
                  <span className="text-[10px] font-bold text-slate-400 block mb-1">📄 PDF 자동 하이라이트 발췌문:</span>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800/80 text-xs text-slate-200 leading-relaxed font-serif italic border-l-4 border-l-teal-500">
                    "{selectedItem.pdfSnippet}"
                  </div>
                </div>

                {/* Extracted Value & Notes */}
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1 text-xs">
                  <div className="flex justify-between">
                    <span className="text-slate-400">추출 정량값:</span>
                    <span className="font-bold text-white font-mono">{selectedItem.extractedValue}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">검증 코멘트:</span>
                    <span className="text-slate-300">{selectedItem.missingNotes}</span>
                  </div>
                </div>

                {/* Verification Actions */}
                <div className="pt-2 flex gap-2">
                  {selectedItem.status !== 'verified' ? (
                    <button 
                      onClick={() => approveItem(selectedItem.id)}
                      className="flex-1 py-3 bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs rounded-xl shadow-lg active:scale-95 transition-all">
                      ✅ 공시 인정 및 인덱스 반영
                    </button>
                  ) : (
                    <div className="flex-1 py-2.5 text-center text-xs font-bold text-emerald-400 bg-emerald-950/40 rounded-xl border border-emerald-800">
                      ✓ 검증 완료된 지표입니다
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* EXPORT WORKBENCH */}
            <div className="pt-2 space-y-2">
              <button 
                onClick={handleExportExcel}
                className="w-full py-3.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold text-xs rounded-2xl shadow-xl active:scale-98 transition-all flex items-center justify-center gap-2">
                <span>📑 GRI Content Index 엑셀 내보내기 (.xlsx)</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
